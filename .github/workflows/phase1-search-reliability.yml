name: Phase 1 - Search Reliability

on:
  push:
    branches:
      - "phase-1/**"
    paths:
      - "ai.py"
      - "engine.py"
      - "evaluation.py"
      - "tests/**"
      - "benchmarks/**"
      - "docs/**"
      - ".github/workflows/phase1-search-reliability.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "ai.py"
      - "engine.py"
      - "evaluation.py"
      - "tests/**"
      - "benchmarks/**"
      - "docs/**"
      - ".github/workflows/phase1-search-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-search-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest python-chess

      - name: Compile application modules
        run: python -m py_compile ai.py engine.py evaluation.py main.py

      - name: Run complete test suite
        run: python -m pytest -v

      - name: Run fixed-position search benchmark
        run: |
          python benchmarks/search_benchmark.py --depth 2 --repeats 2 --search-mode full-window
          python benchmarks/search_benchmark.py --depth 2 --repeats 2 --search-mode pvs
          python benchmarks/search_benchmark.py --depth 3 --repeats 1 --search-mode full-window
          python benchmarks/search_benchmark.py --depth 3 --repeats 1 --search-mode pvs
